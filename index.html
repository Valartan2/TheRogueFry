<script>
// Les deux jeux restent des fichiers complets, chacun dans son propre cadre : aucun mélange de code entre eux.
const urls = {};
function gameUrl(k){ if (urls[k]) return urls[k];
  const b = atob(document.getElementById('g-' + k).textContent.trim()), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return urls[k] = URL.createObjectURL(new Blob([u], { type: 'text/html' })); }
const menu = document.getElementById('menu'), game = document.getElementById('game'), back = document.getElementById('back');
function play(k){ game.src = gameUrl(k); game.style.display = 'block'; back.style.display = 'block'; menu.style.display = 'none'; try { localStorage.setItem('pelle-mode', k); } catch (e) {} setTimeout(() => game.focus(), 50); }
function toMenu(){ game.src = 'about:blank'; game.style.display = 'none'; back.style.display = 'none'; menu.style.display = 'flex'; }
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => play(b.dataset.g)));
back.addEventListener('click', toMenu);
</script>
</body></html>
