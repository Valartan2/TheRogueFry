<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sable">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Pelle & Sable – Territoire</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --floor:#ffffff; --ink:#f6f0ff; --gold:#ffcc33; --gold-dark:#c98a12;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --floor:#ffffff; } }
  :root[data-theme="dark"]{ --floor:#ffffff; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  body{ height:100%; margin:0; background:var(--floor); overflow:hidden;
        font-family:"Press Start 2P", "Courier New", monospace; color:var(--ink);
        -webkit-user-select:none; user-select:none; }
  canvas{ position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  html.phoneframe{ background:#1b1530; }
  html.phoneframe body{ margin:0 auto; position:relative; transform:translateZ(0); box-shadow:0 0 0 2px #4a3f66, 0 10px 60px #000a; } /* format téléphone centré : les éléments « fixed » restent dans le cadre */
  #hud{ position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:10px; right:10px; display:flex; flex-direction:row; justify-content:space-between; gap:6px; pointer-events:none; }
  .chip{ display:flex; align-items:center; gap:8px; background:#1b1530; border:3px solid #4a3f66; padding:7px 10px; font-size:11px; }
  .chip i{ width:12px; height:12px; background:var(--gold); border:3px solid var(--gold-dark); border-radius:50%; display:inline-block; }
  #pot{ visibility:hidden !important; } /* plus de compteur de pelles ni de jauge */
  #nextBar{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); width:min(220px, 50vw); height:14px; background:#1b1530cc; border:2px solid #ffffff; pointer-events:none; overflow:hidden; } /* jauge de la prochaine pelle */
  #nextFill{ height:100%; width:0; background:#ffcc33; transition:width .15s; }
  #nextBar span{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#ffffff; text-shadow:1px 1px 0 #1b1530; }
  #remain{ display:none !important; } /* ton % est déjà dans ta ligne du classement */
  #timer{ position:absolute; right:0; top:0; } /* chrono tout à droite */
  #timer, #timer span{ color:#1b1530 !important; }
  #timer{ background:none !important; border:none !important; padding:4px 0 !important; font-size:18px; color:#1b1530; text-shadow:2px 2px 0 #ffffff, -2px -2px 0 #ffffff, 2px -2px 0 #ffffff, -2px 2px 0 #ffffff; } /* chrono : juste les chiffres */
  #growBar{ height:4px; background:#ffffff22; } #growFill{ height:100%; width:0; background:var(--gold); transition:width .2s; }
  #bar{ display:none !important; }
  #remain{ color:#ff8a3d; }
  #hint{ display:none !important; position:fixed; left:0; right:0; bottom:calc(96px + env(safe-area-inset-bottom,0px)); text-align:center;
         font-size:11px; line-height:1.8; opacity:.85; pointer-events:none; transition:opacity .6s; padding:0 20px; }
  /* écran entre deux niveaux : victoire + boutique */
  #shop{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px;
         background:#0b0816ee; padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px)); text-align:center; z-index:5; }
  #shop h1{ font-size:18px; line-height:1.6; margin:0; color:var(--gold); font-weight:normal; }
  #shop .sub{ font-size:10px; line-height:1.9; margin:0; opacity:.85; }
  #shop #fresco{ position:static; inset:auto; flex:none; width:min(300px, 76vw); height:auto; touch-action:auto; image-rendering:pixelated; border:3px solid #4a3f66; background:#120d22; }
  #frescoTxt{ font-size:11px; color:var(--gold); opacity:1; }
  #sandBuy{ font-family:inherit; font-size:10px; color:#ffe9b0; background:#2a1f10; border:3px solid #c98a12; padding:10px 14px; cursor:pointer; }
  #potNote{ font-size:8px; opacity:.6; margin-top:-8px; }
  #sandBuy:disabled{ opacity:.45; cursor:default; }
  #shop .bank{ font-size:16px; color:var(--gold); display:flex; align-items:center; gap:10px; }
  #shop .bank i{ width:16px; height:16px; background:var(--gold); border:3px solid var(--gold-dark); border-radius:50%; display:inline-block; }
  #next{ font:inherit; font-size:13px; color:#0b0816; background:var(--gold); border:0; padding:15px 24px; cursor:pointer; }
  /* barre d'améliorations, achetables pendant la partie */
  #perm{ display:none !important; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; width:min(340px, 90vw); }
  #perm .title{ grid-column:1 / -1; font-size:9px; text-align:center; opacity:.8; margin:0; }
  #bar{ position:fixed; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom,0px)); display:grid;
        grid-template-columns:repeat(5, minmax(0, 1fr)); gap:3px; z-index:3; }
  #bar .up{ font-size:7px; padding:7px 1px; } #bar .up .what{ font-size:6px; } #bar .up .price{ font-size:9px; }
  .up{ font:inherit; font-size:8px; line-height:1.8; color:var(--ink); background:#0b0816d9; border:3px solid #4a3f66;
        padding:8px 2px; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .up b{ display:block; font-weight:normal; }
  .up .what{ opacity:.75; font-size:7px; }
  .up .price{ color:#f6f0ff66; font-size:10px; margin-top:3px; }
  .up:disabled{ cursor:default; }
  .up.ok{ border-color:var(--c); animation:glow .8s ease-in-out infinite alternate; }
  .up.ok .price{ color:var(--gold); }
  .up.pop{ animation:pop .25s; }
  @keyframes glow{ to{ box-shadow:0 0 14px var(--c); } }
  @keyframes pop{ 50%{ transform:scale(1.12); } }
  @media (prefers-reduced-motion: reduce){ .up.ok, .up.pop{ animation:none; } }
  #bar button:focus-visible, #shop button:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  /* version de lancement : partie chronométrée, écran de fin simple */
  #sandBuy, #potNote, #shop .bank, #perm{ display:none !important; }
  #shop #fresco{ width:min(230px, 60vw) !important; } #shop{ gap:10px; } #rank div{ padding:7px 10px; } /* la fresque à remplir revient sur l'écran de fin */
  #timer.hurry{ color:#ff4d6d; animation:pop .5s infinite; }
  #shop #shopTitle{ font-size:22px; }
  #shop .big{ font-size:30px; color:var(--gold); margin:4px 0; text-shadow:3px 3px 0 #8a5a00; }
  #rank{ display:flex; flex-direction:column; gap:10px; width:min(300px, 86vw); }
  #rank div{ display:flex; justify-content:space-between; font-size:11px; padding:10px 12px; background:#00000055; border:3px solid var(--c); }
  #next{ font-size:16px; padding:18px 34px; box-shadow:4px 4px 0 #8a5a00; }
  #share{ font:inherit; font-size:11px; color:#f6f0ff; background:none; border:3px solid #4a3f66; padding:12px 16px; cursor:pointer; }
  #next:active, #share:active{ transform:translate(3px,3px); }

  #splash{ position:fixed; inset:0; z-index:1000; background:#e8821a; overflow:hidden;
          opacity:1; transition:opacity .4s ease; touch-action:none; }
  #splash.out{ opacity:0; pointer-events:none; }
  #splash img{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  #splash .bg{ min-width:100%; min-height:100%; width:auto; height:auto; object-fit:cover;
               filter:blur(22px) brightness(.9); transform:translate(-50%,-50%) scale(1.15); }
  #splash .fg{ width:100%; max-height:100%; object-fit:contain; }
  #splash .load{ position:absolute; left:14%; right:14%; bottom:calc(6% + env(safe-area-inset-bottom,0px));
                 height:12px; border-radius:8px; background:#0006; border:2px solid #fff8; overflow:hidden; }
  #splash .load i{ display:block; height:100%; width:0; background:linear-gradient(#ffe066,#ff9d1a);
                   border-radius:6px; animation:splashLoad 3.6s linear forwards; }
  @keyframes splashLoad{ to{ width:100%; } }
</style>
</head>

  fctx.fillStyle = '#120d22'; fctx.fillRect(0, 0, FRESCO.w * FC, FRESCO.h * FC);

  for (let m = 0; m < n; m++){ const i = frescoOrder[m]; fctx.fillStyle = frCol[i]; fctx.fillRect((i % FRESCO.w) * FC, Math.floor(i / FRESCO.w) * FC, FC, FC); }

function animateFresco(from, to){ // le sable coule dans la fresque
  frFrom = frShown = from; frT = 0; const dur = Math.min(2.4, 0.8 + (to - from) / 400);
  cancelAnimationFrame(frRaf); let last = performance.now();
  const step = now => {

    frT = Math.min(1, frT + dt / dur);

    frDrops = frDrops.filter(d => d.y < d.ty);

  }
}
function drawGoal(){ // repère du point visé
  if (!swarmGoal) return; goalPing = Math.max(0, goalPing - 1 / 60);
  const r = (14 + 30 * goalPing) / zoom; ctx.strokeStyle = 'rgba(255,204,51,' + (0.35 + goalPing * 0.6) + ')'; ctx.lineWidth = 2.5 / zoom;
  ctx.beginPath(); ctx.arc(swarmGoal.x, swarmGoal.y, r, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(swarmGoal.x, swarmGoal.y, 3 / zoom, 0, 7); ctx.fillStyle = '#ffcc33'; ctx.fill();
}

function charFor(hex){ // le personnage recoloré dans la couleur de l'équipe (les yeux noirs et blancs restent intacts)
  if (charCache[hex]) return charCache[hex];
  const c = document.createElement('canvas'); c.width = charImg.width; c.height = charImg.height; const g = c.getContext('2d'); g.drawImage(charImg, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), px = d.data, n = parseInt(hex.slice(1), 16), tr = n >> 16, tg = (n >> 8) & 255, tb = n & 255;
  for (let i = 0; i < px.length; i += 4){ if (!px[i + 3]) continue;
    const r = px[i], gg = px[i + 1], b = px[i + 2], mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), sat = mx ? (mx - mn) / mx : 0;
    if (sat < 0.3) continue; // noir, blanc, gris : on garde
    const L = (0.3 * r + 0.59 * gg + 0.11 * b) / 120; // 120 ≈ luminosité de l'orange d'origine
    px[i] = Math.min(255, tr * L); px[i + 1] = Math.min(255, tg * L); px[i + 2] = Math.min(255, tb * L); }
  g.putImageData(d, 0, 0); charCache[hex] = c; return c;
}
// ===== PERSONNAGE EN 3D : la bestiole est modélisée en volumes (cubes) et rendue en 3D au lancement,
// vue du dessus inclinée, dans 8 directions et 2 poses de marche. En jeu, chaque bestiole affiche la vue qui correspond à sa direction.
const CHAR3D_DIRS = 16, CHAR3D_FRAMES = 1, CHAR_TURN = 9, CHAR_HOP = 0.07, CHAR_HOP_HZ = 8.5, CHAR_SQUASH = 0.06, // fluidité : 16 vues au lieu de 8, le personnage PIVOTE progressivement (CHAR_TURN : vitesse de rotation), et un saut continu (hauteur, fréquence, écrasement) remplace l'alternance de 2 poses
  CHAR3D_PX = 128, CHAR3D_TILT = 38 * Math.PI / 180; // CHAR3D_TILT : angle de la caméra (comme la vue du jeu)

function char3dModel(frame){ // la fourmi chibi : un seul cube posé au sol (sans pattes), 2 antennes à bout carré ; en marche, elle sautille
  const B = [], dy = frame ? 0.06 : 0;
  B.push([-0.5, 0.5, dy, 0.92 + dy, -0.46, 0.46, C3_BODY]); // le cube
  [-1, 1].forEach(sx => { B.push([sx * 0.24 - 0.07, sx * 0.24 + 0.07, 0.92 + dy, 1.3 + dy, 0.02, 0.16, C3_DARK]); // tiges des antennes
    B.push([sx * 0.27 - 0.15, sx * 0.27 + 0.15, 1.25 + dy, 1.52 + dy, 0.0, 0.3, C3_TIP]); });                       // bouts carrés
  return B;
}

  if (!vimg || vimg.width < vw || vimg.height < vh){ vimg = document.createElement('canvas'); vimg.width = Math.max(vw, vimg ? vimg.width : 0); vimg.height = Math.max(vh, vimg ? vimg.height : 0);
    vimg.g = vimg.getContext('2d'); vimg.d = vimg.g.createImageData(vimg.width, vimg.height); vimg.p = new Uint32Array(vimg.d.data.buffer); }
  if (lod === 1) for (let y = 0; y < vh; y++){ const r0 = (vy0 + y) * GW; vimg.p.set(pix32.subarray(r0 + vx0, r0 + vx0 + vw), y * vimg.width); }
  else for (let y = 0; y < vh; y++){ const r0 = (vy0 + y * 2) * GW + vx0, o = y * vimg.width;
    const ly = ((vy0 + y * 2 + lavaOY) & (LAVA_N - 1)) * LAVA_N, hy = ((vy0 + y * 2) & 63) << 6; for (let x = 0; x < vw; x++){ const i = r0 + x * 2, oo = owner ? owner[i] : -1; vimg.p[o + x] = state[i] === PACKED ? color[i] : (oo === 0 && LAVA ? lavaTile[ly + ((vx0 + x * 2 + lavaOX) & (LAVA_N - 1))] : oo >= 0 ? (EATEN ? holeT[oo][((vx0 + x * 2) & 63) | hy] : teamCol32[oo]) : outCol(i, vx0 + x * 2, vy0 + y * 2)); } }
  vimg.g.putImageData(vimg.d, 0, 0, 0, 0, vw, vh);

  ctx.textAlign = 'center'; ctx.font = Math.round(9 / zoom) + 'px "Press Start 2P", monospace'; // textes lisibles à tout zoom

    if (!f.keep) return; // plus aucun texte à l'écran, sauf le « +1 »
    ctx.globalAlpha = Math.max(0, f.life * 1.5); ctx.fillStyle = f.color;
    if (f.big){ ctx.save(); ctx.font = Math.round(13 / zoom) + 'px "Press Start 2P", monospace'; ctx.strokeStyle = '#0e0a1c'; ctx.lineWidth = 4 / zoom; ctx.strokeText(f.txt, f.x, f.y - 12 / zoom); ctx.fillText(f.txt, f.x, f.y - 12 / zoom); ctx.restore(); }
    else ctx.fillText(f.txt, f.x, f.y - 12 / zoom);
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  ctx.restore();
  if (TILT){ W = realW; H = realH; dpr = dprMain; ctx = mainCtx; drawTilted(); } // le monde incliné ; le HUD reste droit
  drawMinimap();
  if (false && CONTROL === 'drag' && drag && drag.moved > 12 && playing){ // (joystick visuel retiré)
    const R = 46, dx = drag.x - drag.sx, dy = drag.y - drag.sy, l = Math.hypot(dx, dy) || 1, k = Math.min(1, R / l);
    ctx.globalAlpha = 0.35; ctx.strokeStyle = '#1b1530'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(drag.sx, drag.sy, R, 0, 7); ctx.stroke();
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#1b1530'; ctx.beginPath(); ctx.arc(drag.sx + dx * k, drag.sy + dy * k, 16, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }

    ctx.strokeStyle = '#f6f0ff33'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, JOY_RADIUS, 0, 7); ctx.stroke();
    ctx.fillStyle = '#f6f0ff44'; ctx.beginPath(); ctx.arc(joy.x, joy.y, 14, 0, 7); ctx.fill();

}
// minicarte (seulement si le monde dépasse l'écran) : le sable, le trou, la zone visible, la pelle
let mini = null, vimg = null; // minicarte : petite image recalculée toutes les 20 images en échantillonnant la grille
function refreshMini(){
  const mw = 90, mh = Math.max(1, Math.round(90 * GH / GW));
  if (!mini || mini.width !== mw || mini.height !== mh){ mini = document.createElement('canvas'); mini.width = mw; mini.height = mh; mini.g = mini.getContext('2d'); mini.d = mini.g.createImageData(mw, mh); mini.p = new Uint32Array(mini.d.data.buffer); }
  for (let y = 0; y < mh; y++){ const gy = Math.floor((y + 0.5) * GH / mh); for (let x = 0; x < mw; x++){ const i = gy * GW + Math.floor((x + 0.5) * GW / mw); mini.p[y * mw + x] = state[i] === PACKED ? color[i] : (owner && owner[i] >= 0 ? teamCol32[owner[i]] : BOAT && boatStatic ? (boatStatic[i] > 1 ? boatStatic[i] : boatStatic[i] ? 0 : pk(53, 176, 232)) : 0); } }
  mini.g.putImageData(mini.d, 0, 0);
}
function drawMinimap(){
  if (!playing || (W / zoom >= WW - 1 && H / zoom >= WH - 1)) return;
  const sc = Math.min(80 / WW, 120 / WH), mw = WW * sc, mh = WH * sc, mx = 12, my = H - mh - 16 - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('padding-bottom')) || 0); // minicarte en bas à gauche
  ctx.fillStyle = '#0e0a1ccc'; ctx.fillRect(mx - 4, my - 4, mw + 8, mh + 8);
  ctx.fillStyle = '#2a2140'; ctx.fillRect(mx, my, mw, mh);
  if (mini) ctx.drawImage(mini, mx, my, mw, mh);
  if (false) for (const h of allHoles()){
    ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.arc(mx + h.x * sc, my + h.y * sc, Math.max(3, h.r * sc) + 1, 0, 7); ctx.fill();
    ctx.fillStyle = '#05030b'; ctx.beginPath(); ctx.arc(mx + h.x * sc, my + h.y * sc, Math.max(2, h.r * sc), 0, 7); ctx.fill();
  }
  ctx.strokeStyle = '#f6f0ff88'; ctx.lineWidth = 1; ctx.strokeRect(mx + cam.x * sc, my + cam.y * sc, W / zoom * sc, H / zoom * sc);
  for (const b of bots){ ctx.fillStyle = TEAMS[b.team].main; ctx.fillRect(mx + b.st.shovel.x * sc - 1.5, my + b.st.shovel.y * sc - 1.5, 3, 3); }
}
// flèche au bord de l'écran quand le trou est hors champ
function drawTeams(){ // classement en direct : % de la carte dévorée + nombre de pelles
  if (!playing) return;
  const sh = liveShare(), order = TEAMS.map((_, k) => k).sort((a, b) => sh[b] - sh[a]);
  ctx.font = '8px "Press Start 2P", monospace'; ctx.textAlign = 'left';
  const x = 12, w = 170; let y = SAFE_TOP + 24; // classement en haut à gauche, sans cadre (contour sombre pour rester lisible)
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b1530'; ctx.lineWidth = 3;
  for (const k of order){
    const T = TEAMS[k], n = bots.filter(o => o.team === k && o.kind !== 'sweep').length;
    ctx.fillStyle = T.main; ctx.fillRect(x, y + 3, Math.max(2, (w - 18) * sh[k] / Math.max(1, ...sh)), 2);
    const label = (k ? T.name : 'TOI') + ' ' + sh[k] + ' %'; ctx.strokeText(label, x, y); ctx.fillText(label, x, y);
    ctx.textAlign = 'right'; const nn = k && !T.alive ? '…' : String(n); ctx.strokeText(nn, x + w - 16, y); ctx.fillText(nn, x + w - 16, y); ctx.textAlign = 'left';
    y += 15;
  }
}
function drawBoost(){
  if (boost < 0.05 || !playing) return;
  const w = 120, x = W / 2 - w / 2, y = SAFE_TOP + 56;
  ctx.fillStyle = '#0e0a1c'; ctx.fillRect(x - 2, y - 2, w + 4, 10);
  ctx.fillStyle = '#ffcc33'; ctx.fillRect(x, y, w * boost / 2, 6);
  ctx.textAlign = 'center'; ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = '#ffcc33';
  ctx.fillText('BOOST x' + (1 + boost).toFixed(1), W / 2, y + 20);
}
function drawHoleArrow(){
  if (!playing) return;
  const hx = (hole.x - cam.x) * zoom, hy = (hole.y - cam.y) * zoom, r = hole.r * zoom;
  const top = SAFE_TOP + 56, bottom = H - BAR - 10;
  if (hx + r > 0 && hx - r < W && hy + r > top && hy - r < bottom) return;
  const cx = W / 2, cy = (top + bottom) / 2, dx = hx - cx, dy = hy - cy;
  const f = Math.min((W / 2 - 26) / Math.abs(dx || 1e-6), ((bottom - top) / 2 - 26) / Math.abs(dy || 1e-6));
  const ax = cx + dx * f, ay = cy + dy * f, a = Math.atan2(dy, dx), pulse = 1 + 0.12 * Math.sin(t * 8);
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(a); ctx.scale(pulse, pulse);
  ctx.fillStyle = '#ffcc33'; ctx.strokeStyle = '#0e0a1c'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -12); ctx.lineTo(-4, 0); ctx.lineTo(-10, 12); ctx.closePath(); ctx.stroke(); ctx.fill();
  ctx.restore();
}
const PHONE_FRAME = false; let OFFX = 0; // PHONE_FRAME : sur ordinateur, afficher le jeu au format iPhone
function layout(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  // sur un écran large (ordinateur), le jeu s'affiche au format téléphone, centré : même rendu que sur iPhone
  const phone = PHONE_FRAME && innerWidth > innerHeight * 0.75;
  document.documentElement.classList.toggle('phoneframe', phone);
  if (phone){ const pw = Math.round(Math.min(innerHeight * 0.47, 460)); document.body.style.width = pw + 'px'; W = pw; OFFX = (innerWidth - pw) / 2; }
  else { document.body.style.width = ''; W = innerWidth; OFFX = 0; }
  H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
  SAFE_TOP = parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0;
  BAR = 20; // plus de barre d'améliorations
}
addEventListener('resize', layout);
let last = performance.now();
function loop(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now; // si l'appareil rame, le jeu garde sa vitesse au lieu de passer au ralenti
  requestAnimationFrame(loop); // la boucle continue même si une image plante
  tiltSetup(); W = Ww; H = Hw; // la caméra raisonne sur l'image du monde
  try { if (!window.__splash) update(dt); } catch (e) { showErr('update', e); }
  W = realW; H = realH;
  try { draw(); } catch (e) { showErr('draw', e); }
}
function showErr(where, e){ // en cas de bug : le message s'affiche en bas de l'écran (à m'envoyer en capture)
  let el = document.getElementById('errBox');
  if (!el){ el = document.createElement('div'); el.id = 'errBox'; el.style.cssText = 'position:fixed;left:6px;right:6px;bottom:6px;z-index:99;font:11px monospace;color:#fff;background:#b0002acc;padding:6px;white-space:pre-wrap;pointer-events:none'; document.body.appendChild(el); }
  const msg = where + ' : ' + (e && e.message) + '\n' + ((e && e.stack) || '').split('\n').slice(0, 3).join('\n');
  if (el.textContent !== msg) el.textContent = msg;
}
window.addEventListener('error', e => showErr('init', e.error || { message: e.message }));
try { layout(); startLevel(); } catch (e) { showErr('init', e); }
requestAnimationFrame(loop);
