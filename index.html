<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sable">
<title>Pelle & Sable – Trou</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --floor:#2a2140; --ink:#f6f0ff; --gold:#ffcc33; --gold-dark:#c98a12;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --floor:#2a2140; } }
  :root[data-theme="dark"]{ --floor:#2a2140; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  body{ height:100%; margin:0; background:var(--floor); overflow:hidden;
        font-family:"Press Start 2P", "Courier New", monospace; color:var(--ink);
        -webkit-user-select:none; user-select:none; }
  canvas{ position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #hud{ position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:10px; right:10px; display:flex; flex-direction:row; justify-content:space-between; gap:6px; pointer-events:none; }
  .chip{ display:flex; align-items:center; gap:8px; background:#00000066; border:3px solid #4a3f66; padding:7px 10px; font-size:11px; }
  .chip i{ width:12px; height:12px; background:var(--gold); border:3px solid var(--gold-dark); border-radius:50%; display:inline-block; }
  #pot{ border-color:var(--gold-dark); font-size:12px; flex-direction:column; align-items:stretch; gap:5px; }
  #growBar{ height:4px; background:#ffffff22; } #growFill{ height:100%; width:0; background:var(--gold); transition:width .2s; }
  #bar{ display:none !important; }
  #remain{ color:#ff8a3d; }
  #hint{ display:none !important; position:fixed; left:0; right:0; bottom:calc(96px + env(safe-area-inset-bottom,0px)); text-align:center;
         font-size:11px; line-height:1.8; opacity:.85; pointer-events:none; transition:opacity .6s; padding:0 20px; }
  /* écran entre deux niveaux : victoire + boutique */
  #shop{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px;
         background:#0b0816ee; padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px)); text-align:center; z-index:5; }
  #shop h1{ font-size:18px; line-height:1.6; margin:0; color:var(--gold); font-weight:normal; }
  #shop .sub{ font-size:10px; line-height:1.9; margin:0; opacity:.85; }
  #shop #fresco{ position:static; inset:auto; flex:none; width:min(300px, 76vw); height:auto; touch-action:auto; image-rendering:pixelated; border:3px solid #4a3f66; background:#120d22; }
  #frescoTxt{ font-size:11px; color:var(--gold); opacity:1; }
  #sandBuy{ font-family:inherit; font-size:10px; color:#ffe9b0; background:#2a1f10; border:3px solid #c98a12; padding:10px 14px; cursor:pointer; }
  #potNote{ font-size:8px; opacity:.6; margin-top:-8px; }
  #sandBuy:disabled{ opacity:.45; cursor:default; }
  #shop .bank{ font-size:16px; color:var(--gold); display:flex; align-items:center; gap:10px; }
  #shop .bank i{ width:16px; height:16px; background:var(--gold); border:3px solid var(--gold-dark); border-radius:50%; display:inline-block; }
  #next{ font:inherit; font-size:13px; color:#0b0816; background:var(--gold); border:0; padding:15px 24px; cursor:pointer; }
  /* barre d'améliorations, achetables pendant la partie */
  #perm{ display:none !important; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; width:min(340px, 90vw); }
  #perm .title{ grid-column:1 / -1; font-size:9px; text-align:center; opacity:.8; margin:0; }
  #bar{ position:fixed; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom,0px)); display:grid;
        grid-template-columns:repeat(5, minmax(0, 1fr)); gap:3px; z-index:3; }
  #bar .up{ font-size:7px; padding:7px 1px; } #bar .up .what{ font-size:6px; } #bar .up .price{ font-size:9px; }
  .up{ font:inherit; font-size:8px; line-height:1.8; color:var(--ink); background:#0b0816d9; border:3px solid #4a3f66;
        padding:8px 2px; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .up b{ display:block; font-weight:normal; }
  .up .what{ opacity:.75; font-size:7px; }
  .up .price{ color:#f6f0ff66; font-size:10px; margin-top:3px; }
  .up:disabled{ cursor:default; }
  .up.ok{ border-color:var(--c); animation:glow .8s ease-in-out infinite alternate; }
  .up.ok .price{ color:var(--gold); }
  .up.pop{ animation:pop .25s; }
  @keyframes glow{ to{ box-shadow:0 0 14px var(--c); } }
  @keyframes pop{ 50%{ transform:scale(1.12); } }
  @media (prefers-reduced-motion: reduce){ .up.ok, .up.pop{ animation:none; } }
  #bar button:focus-visible, #shop button:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  /* version de lancement : partie chronométrée, écran de fin simple */
  #sandBuy, #potNote, #shop .bank, #perm{ display:none !important; }
  #shop #fresco{ width:min(230px, 60vw) !important; } #shop{ gap:10px; } #rank div{ padding:7px 10px; } /* le skin à remplir revient sur l'écran de fin */
  #timer.hurry{ color:#ff4d6d; border-color:#ff4d6d; animation:pop .5s infinite; }
  #shop #shopTitle{ font-size:22px; }
  #shop .big{ font-size:30px; color:var(--gold); margin:4px 0; text-shadow:3px 3px 0 #8a5a00; }
  #rank{ display:none !important; flex-direction:column; gap:10px; width:min(300px, 86vw); }
  #rank div{ display:flex; justify-content:space-between; font-size:11px; padding:10px 12px; background:#00000055; border:3px solid var(--c); }
  #next{ font-size:16px; padding:18px 34px; box-shadow:4px 4px 0 #8a5a00; }
  #share{ font:inherit; font-size:11px; color:#f6f0ff; background:none; border:3px solid #4a3f66; padding:12px 16px; cursor:pointer; }
  #next:active, #share:active{ transform:translate(3px,3px); }

  html.sp{ background:#e8821a !important; }
  #splash{ position:fixed; left:0; top:0; right:0; height:var(--fullH,100%);
          z-index:1000; background:#e8821a; overflow:hidden; opacity:1; transition:opacity .4s ease; touch-action:none; }
  #splash.out{ opacity:0; pointer-events:none; }
  #splash img{ position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; object-position:center; }
  #splash .load{ position:absolute; left:14%; right:14%; bottom:calc(7% + env(safe-area-inset-bottom,0px));
                 height:12px; border-radius:8px; background:#0006; border:2px solid #fff8; overflow:hidden; }
  #splash .load i{ display:block; height:100%; width:0; background:linear-gradient(#ffe066,#ff9d1a);
                   border-radius:6px; animation:splashLoad 5.6s linear forwards; }
  @keyframes splashLoad{ to{ width:100%; } }
</style>
</head>
<body>
<script>window.__splash=false; // MODE TROU : pas d'écran de chargement (l'image Swarm.io ne correspond pas à ce mode)</script>
<canvas id="c"></canvas>
<div id="hud">
  <div class="chip" id="pot" style="display:none"><span id="potTxt">PELLES 1</span><div id="growBar"><div id="growFill"></div></div></div>
  <div class="chip" id="timer" style="margin-left:auto"><span id="lvlTxt">3:00</span></div>
</div>
<div id="hint">Touche l'écran pour lancer ton essaim</div>
<div id="bar"></div>
<div id="shop">
  <h1 id="shopTitle">NIVEAU 1<br>TERMINÉ !</h1>
  <p class="sub" id="shopSub"></p>
  <canvas id="fresco" width="261" height="288" aria-label="Dessin à compléter"></canvas>
  <p class="sub" id="frescoTxt"></p>
  <div class="bank"><i></i><span id="shopBank">0</span></div>
  <button id="sandBuy"></button>
  <p class="sub" id="potNote">L'argent restant ne passe pas au dessin suivant</p>
  <div id="perm"><p class="title">AMÉLIORATIONS PERMANENTES</p></div>
  <div id="rank"></div>
  <button id="next">REJOUER</button>
  <button id="share">DÉFIE UN POTE</button>
</div>

  const vx1 = full ? GW : Math.min(GW, Math.ceil((cam.x + W / zoom) / S) + 2), vy1 = full ? GH : Math.min(GH, Math.ceil((cam.y + H / zoom) / S) + 2);
  const lod = zoom * S >= 1.25 ? 1 : zoom * S * 2 >= 1.25 ? 2 : zoom * S * 4 >= 1.25 ? 4 : 8; // FLUIDITÉ : plus on dézoome, plus on saute de grains (1 sur 2, 4, 8) → le coût du dessin reste le même quelle que soit la taille du trou // dézoomé (1 grain < 1,25 px à l'écran) : on dessine 1 grain sur 2 dans chaque sens, 4× moins de calcul, invisible à l'œil
  const vm = 60 / zoom, inView = o => o.st.shovel.x > cam.x - vm && o.st.shovel.x < cam.x + W / zoom + vm && o.st.shovel.y > cam.y - vm && o.st.shovel.y < cam.y + H / zoom + vm;

  }
  const vw = Math.max(1, Math.ceil((vx1 - vx0) / lod)), vh = Math.max(1, Math.ceil((vy1 - vy0) / lod));

    vimg.g = vimg.getContext('2d'); vimg.d = vimg.g.createImageData(vimg.width, vimg.height); vimg.p = new Uint32Array(vimg.d.data.buffer); }

  else for (let y = 0; y < vh; y++){ const r0 = (vy0 + y * lod) * GW + vx0, o = y * vimg.width;
    for (let x = 0; x < vw; x++){ const i = r0 + x * lod; vimg.p[o + x] = state[i] === PACKED ? color[i] : (state[i] === WALL ? 0 : owner[i] >= 0 ? holePick(owner[i], i)[(((vx0 + x * lod) & 63) | (((vy0 + y * lod) & 63) << 6))] : 0); } }

  ctx.imageSmoothingEnabled = false;
  if (HOLE_MODE){ drawHolePits(); drawHoleRims(); } // le puits ET son contour sont dessinés SOUS l'image du sable : côté lointain, la tranche du sable passe par-dessus le contour
  ctx.drawImage(vimg, 0, 0, vw, vh, vx0 * S, vy0 * S, vw * S * lod, vh * S * lod);
  drawHidden(); drawBots(); if (HOLE_MODE){ drawBonusItems(); drawSucks(); drawHoleLabels(); } drawGoal();
  const ps = 3 / Math.min(1, zoom);
  for (const p of sparks){ ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x - ps / 2, p.y - ps / 2, ps, ps); }
  ctx.textAlign = 'center'; ctx.font = Math.round(9 / zoom) + 'px "Press Start 2P", monospace'; // textes lisibles à tout zoom
  floaters.forEach(f => {
    if (!f.keep) return; // plus aucun texte à l'écran, sauf le « +1 »
    ctx.globalAlpha = Math.max(0, f.life * 1.5); ctx.fillStyle = f.color;
    if (f.big){ ctx.save(); ctx.font = Math.round(13 / zoom) + 'px "Press Start 2P", monospace'; ctx.strokeStyle = '#0e0a1c'; ctx.lineWidth = 4 / zoom; ctx.strokeText(f.txt, f.x, f.y - 12 / zoom); ctx.fillText(f.txt, f.x, f.y - 12 / zoom); ctx.restore(); }

  drawMinimap();
  drawBoost(); drawTeams(); drawBonusHud();
  if (joy.on && !joy.mouse && playing){
    ctx.strokeStyle = '#f6f0ff33'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, JOY_RADIUS, 0, 7); ctx.stroke();

}
// minicarte (seulement si le monde dépasse l'écran) : le sable, le trou, la zone visible, la pelle
let mini = null, vimg = null; // minicarte : petite image recalculée toutes les 20 images en échantillonnant la grille
function miniRect(){ // zone montrée par la carte live : le DESSIN seulement (plus le vide autour), avec une petite marge
  const B = DRAW_B || { x0: 0, y0: 0, x1: WW, y1: WH }, m = 0.03 * Math.max(B.x1 - B.x0, B.y1 - B.y0);
  const x0 = Math.max(0, B.x0 - m), y0 = Math.max(0, B.y0 - m), x1 = Math.min(WW, B.x1 + m), y1 = Math.min(WH, B.y1 + m);
  return { x0, y0, w: x1 - x0, h: y1 - y0 };
}
function refreshMini(){
  const R = miniRect(), mw = 150, mh = Math.max(1, Math.round(150 * R.h / R.w)); // assez de détail pour la carte agrandie
  if (!mini || mini.width !== mw || mini.height !== mh){ mini = document.createElement('canvas'); mini.width = mw; mini.height = mh; mini.g = mini.getContext('2d'); mini.d = mini.g.createImageData(mw, mh); mini.p = new Uint32Array(mini.d.data.buffer); }
  for (let y = 0; y < mh; y++){ const gy = Math.min(GH - 1, Math.floor((R.y0 + (y + 0.5) * R.h / mh) / S));
    for (let x = 0; x < mw; x++){ const i = gy * GW + Math.min(GW - 1, Math.floor((R.x0 + (x + 0.5) * R.w / mw) / S)); mini.p[y * mw + x] = state[i] === PACKED ? color[i] : 0; } }
  mini.g.putImageData(mini.d, 0, 0);
}
const MINI_W = 115, MINI_H = 170; // taille max de la carte live (px)
function drawMinimap(){
  if (!playing || (W / zoom >= WW - 1 && H / zoom >= WH - 1)) return;
  const R = miniRect(), sc = Math.min(MINI_W / R.w, MINI_H / R.h), mw = R.w * sc, mh = R.h * sc, mx = 12, my = H - mh - 46 - SAFE_BOT; // carte live EN BAS À GAUCHE (au-dessus du bouton « MODES » du lanceur)
  ctx.fillStyle = '#0e0a1ccc'; ctx.fillRect(mx - 4, my - 4, mw + 8, mh + 8);
  ctx.fillStyle = '#2a2140'; ctx.fillRect(mx, my, mw, mh);
  if (mini){ ctx.imageSmoothingEnabled = false; ctx.drawImage(mini, mx, my, mw, mh); }
  ctx.save(); ctx.beginPath(); ctx.rect(mx, my, mw, mh); ctx.clip();
  ctx.strokeStyle = '#f6f0ff88'; ctx.lineWidth = 1; ctx.strokeRect(mx + (cam.x - R.x0) * sc, my + (cam.y - R.y0) * sc, (TILT ? Ww : W) / zoom * sc, (TILT ? Hw : H) / zoom * sc);
  for (const b of bots){ const x = mx + (b.st.shovel.x - R.x0) * sc, y = my + (b.st.shovel.y - R.y0) * sc; ctx.fillStyle = '#0e0a1c'; ctx.fillRect(x - 3, y - 3, 6, 6); ctx.fillStyle = TEAMS[b.team].main; ctx.fillRect(x - 2, y - 2, 4, 4); }
  ctx.restore();
}

// flèche au bord de l'écran quand le trou est hors champ
function drawTeams(){ // classement en direct : nom · % du dessin conquis · taille du trou (1, 2, 3…)
  if (!playing) return;
  const sh = TEAMS.map((_, k) => terrPct(k)), order = TEAMS.map((_, k) => k).sort((a, b) => (TERR[b] || 0) - (TERR[a] || 0));
  ctx.font = '8px "Press Start 2P", monospace'; ctx.textAlign = 'left';
  const x = 12, w = 176, cP = x + w - 58, cT = x + w - 16; let y = SAFE_TOP + 22;
  ctx.fillStyle = '#0e0a1caa'; ctx.fillRect(x - 6, y - 12, w, 7 + 15 * (TEAMS.length + 1));
  ctx.fillStyle = '#cfc6e699'; ctx.fillText('JOUEUR', x, y); ctx.textAlign = 'right'; ctx.fillText('%', cP, y); ctx.fillText('TAILLE', cT, y); ctx.textAlign = 'left'; y += 15;
  for (const k of order){
    const T = TEAMS[k], alive = teamBots(k).length > 0;
    ctx.fillStyle = T.main; ctx.fillRect(x, y + 3, Math.max(2, (w - 18) * sh[k] / Math.max(1, ...sh)), 2);
    ctx.fillText(k ? T.name : 'TOI', x, y);
    ctx.textAlign = 'right'; ctx.fillText(sh[k] + ' %', cP, y); ctx.fillText(alive ? String((T.lvl || 0) + 1) : '…', cT, y); ctx.textAlign = 'left';

  }
}
function drawBoost(){
  if (boost < 0.05 || !playing) return;

  ctx.fillStyle = '#0e0a1c'; ctx.fillRect(x - 2, y - 2, w + 4, 10);
  ctx.fillStyle = '#ffcc33'; ctx.fillRect(x, y, w * boost / 2, 6);
  ctx.textAlign = 'center'; ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = '#ffcc33';
  ctx.fillText('BOOST x' + (1 + boost).toFixed(1), W / 2, y + 20);
}
function drawHoleArrow(){
  if (!playing) return;
  const hx = (hole.x - cam.x) * zoom, hy = (hole.y - cam.y) * zoom, r = hole.r * zoom;
  const top = SAFE_TOP + 56, bottom = H - BAR - 10;
  if (hx + r > 0 && hx - r < W && hy + r > top && hy - r < bottom) return;
  const cx = W / 2, cy = (top + bottom) / 2, dx = hx - cx, dy = hy - cy;

  const ax = cx + dx * f, ay = cy + dy * f, a = Math.atan2(dy, dx), pulse = 1 + 0.12 * Math.sin(t * 8);
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(a); ctx.scale(pulse, pulse);
  ctx.fillStyle = '#ffcc33'; ctx.strokeStyle = '#0e0a1c'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -12); ctx.lineTo(-4, 0); ctx.lineTo(-10, 12); ctx.closePath(); ctx.stroke(); ctx.fill();
  ctx.restore();
}
function layout(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
  SAFE_TOP = parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0;
  SAFE_BOT = parseFloat(getComputedStyle(document.documentElement).paddingBottom) || 0;
  BAR = 20; // plus de barre d'améliorations
}
addEventListener('resize', layout);
let last = performance.now();
const SHOW_FPS = true; let fpsN = 0, fpsT = 0, fpsVal = 0; // compteur d'images/seconde en bas à droite (pour mesurer la fluidité sur iPhone)
function loop(now){
  fpsN++; if (now - fpsT > 1000){ fpsVal = Math.round(fpsN * 1000 / (now - fpsT)); fpsN = 0; fpsT = now; }
  const dt = Math.min(0.1, (now - last) / 1000); last = now; // si l'appareil rame, le jeu garde sa vitesse au lieu de passer au ralenti
  requestAnimationFrame(loop); // la boucle continue même si une image plante
  tiltSetup(); W = Ww; H = Hw; // la caméra raisonne sur l'image du monde
  try { if (!window.__splash) update(dt); } catch (e) { showErr('update', e); } // pas de jeu pendant l'écran de chargement
  W = realW; H = realH;
  try { draw(); } catch (e) { showErr('draw', e); }
  if (SHOW_FPS){ mainCtx.setTransform(dpr, 0, 0, dpr, 0, 0); mainCtx.font = '10px monospace'; mainCtx.textAlign = 'right'; mainCtx.fillStyle = '#0e0a1ccc'; mainCtx.fillRect(realW - 74, realH - 22 - SAFE_BOT, 70, 16); mainCtx.fillStyle = fpsVal >= 50 ? '#7dff9a' : fpsVal >= 30 ? '#ffcc33' : '#ff6a6a'; mainCtx.fillText(fpsVal + ' FPS ' + (GPU ? 'GPU' : 'CPU'), realW - 8, realH - 10 - SAFE_BOT); mainCtx.textAlign = 'left'; }
}
function showErr(where, e){ // en cas de bug : le message s'affiche en bas de l'écran (à m'envoyer en capture)
  let el = document.getElementById('errBox');
  if (!el){ el = document.createElement('div'); el.id = 'errBox'; el.style.cssText = 'position:fixed;left:6px;right:6px;bottom:6px;z-index:99;font:11px monospace;color:#fff;background:#b0002acc;padding:6px;white-space:pre-wrap;pointer-events:none'; document.body.appendChild(el); }

}
window.addEventListener('error', e => showErr('init', e.error || { message: e.message }));
try { layout(); startLevel(); } catch (e) { showErr('init', e); }
requestAnimationFrame(loop);
